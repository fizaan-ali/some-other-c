name: C Build and Compilation Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.c'
      - '**.h'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.c'
      - '**.h'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential gcc
    
    - name: Compile all C files
      run: |
        for file in *.c; do
          if [ -f "$file" ]; then
            echo "Compiling $file..."
            gcc -Wall -Wextra -std=c99 -c "$file" -o "${file%.c}.o"
            if [ $? -ne 0 ]; then
              echo "Compilation failed for $file"
              exit 1
            fi
          fi
        done
        echo "All files compiled successfully!"
    
    - name: Link object files
      run: |
        if ls *.o 1> /dev/null 2>&1; then
          gcc -lm -o test_executable *.o 2>/dev/null || true
        fi
    
    - name: Cleanup
      run: rm -f *.o test_executable
